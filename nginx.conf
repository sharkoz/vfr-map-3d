# Config nginx pour la PWA VFR ULM France (servie à la racine).
# Le reverse proxy en amont gère le HTTPS — ici on écoute en clair sur :80.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compression
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json application/geo+json;

    # GeoJSON : bon type MIME + cache court (données aéronautiques)
    location ~* \.geojson$ {
        types { } default_type application/geo+json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Tuiles PMTiles : range requests (servis par défaut) + cache long
    location ~* \.pmtiles$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Service Worker + manifest : jamais en cache dur, sinon les MAJ ne passent pas
    location ~* (sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assets hashés (Vite) : immutables, cache long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA : tout le reste retombe sur index.html (jamais mis en cache)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
